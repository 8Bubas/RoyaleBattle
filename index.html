<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubas Royale PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 4px solid #444; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<script>
    // ТВОИ КЛЮЧИ (уже вписаны)
    const firebaseConfig = {
        apiKey: "AIzaSyCYzLoNr3aS71H4qWAnm5dgUYZhyrSum20",
        authDomain: "clashbattle-5e0b1.firebaseapp.com",
        databaseURL: "https://clashbattle-5e0b1-default-rtdb.firebaseio.com",
        projectId: "clashbattle-5e0b1",
        appId: "1:715854969334:web:9c1d5601b8bccea8b22fd7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // НАСТРОЙКИ ДВИЖКА
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 500,
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let mySide, units, towers, elix = 5, elixText, statusText;

    function preload() {
        // Тут можно будет грузить картинки, пока работаем на фигурах
    }

    function create() {
        let scene = this;
        
        // РИСУЕМ КАРТУ
        scene.add.rectangle(400, 250, 800, 500, 0x2d5a27); // Трава
        scene.add.rectangle(400, 250, 60, 500, 0x2980b9);  // Река
        scene.add.rectangle(400, 120, 120, 80, 0x7e5a3c); // Мост Верхний
        scene.add.rectangle(400, 380, 120, 80, 0x7e5a3c); // Мост Нижний

        units = scene.physics.add.group();
        towers = scene.physics.add.staticGroup();

        // СОЗДАЕМ БАШНИ
        spawnTower(scene, 80, 250, 'blue');
        spawnTower(scene, 720, 250, 'red');

        // КТО Я?
        db.ref('clash/p1').once('value', s => {
            if (!s.val()) {
                mySide = 'blue';
                db.ref('clash/p1').set(true);
                statusText.setText('ТЫ ЗА СИНИХ (СЛЕВА)');
            } else {
                mySide = 'red';
                statusText.setText('ТЫ ЗА КРАСНЫХ (СПРАВА)');
            }
        });

        // СЛУШАЕМ СПАВН
        db.ref('clash/units').on('child_added', s => {
            let d = s.val();
            spawnUnit(scene, d.side, d.lane);
        });

        // ИНТЕРФЕЙС
        elixText = scene.add.text(20, 20, '💧 ЭЛИКСИР: 5', { fontSize: '24px', fontStyle: 'bold', fill: '#fff' });
        statusText = scene.add.text(400, 20, 'ПОДКЛЮЧЕНИЕ...', { fontSize: '20px', fill: '#fbff00' }).setOrigin(0.5);
        scene.add.text(400, 470, 'КЛИКАЙ ВВЕРХ ИЛИ ВНИЗ ДЛЯ ВЫСАДКИ (3 эликсира)', { fontSize: '16px', fill: '#ccc' }).setOrigin(0.5);

        // УПРАВЛЕНИЕ
        scene.input.on('pointerdown', p => {
            if (elix >= 3) {
                elix -= 3;
                let lane = p.y < 250 ? 1 : 2;
                db.ref('clash/units').push({ side: mySide, lane: lane });
            }
        });
    }

    function spawnTower(scene, x, y, side) {
        let t = scene.add.rectangle(x, y, 70, 90, side === 'blue' ? 0x3498db : 0xe74c3c);
        scene.physics.add.existing(t, true);
        t.hp = 500;
        t.side = side;
        towers.add(t);
        // Текст HP над башней
        t.hpDisplay = scene.add.text(x, y - 60, '500', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5);
    }

    function spawnUnit(scene, side, lane) {
        let x = (side === 'blue') ? 140 : 660;
        let y = (lane === 1) ? 120 : 380;
        let u = scene.add.circle(x, y, 18, side === 'blue' ? 0x00ffff : 0xffaa00);
        scene.physics.add.existing(u);
        u.side = side;
        u.hp = 100;
        u.body.setVelocityX(side === 'blue' ? 80 : -80);
        units.add(u);
    }

    function update() {
        if (elix < 10) elix += 0.015;
        elixText.setText('💧 ЭЛИКСИР: ' + Math.floor(elix));

        // ДРАКИ МЕЖДУ ЮНИТАМИ
        game.scene.scenes[0].physics.overlap(units, units, (u1, u2) => {
            if (u1.side !== u2.side) {
                u1.hp -= 1; u2.hp -= 1;
                u1.body.setVelocityX(0); u2.body.setVelocityX(0);
                u1.setAlpha(0.7); u2.setAlpha(0.7);
                if (u1.hp <= 0) u1.destroy();
                if (u2.hp <= 0) u2.destroy();
            }
        });

        // УРОН БАШНЯМ
        game.scene.scenes[0].physics.overlap(units, towers, (u, t) => {
            if (u.side !== t.side) {
                u.body.setVelocityX(0);
                t.hp -= 0.5;
                t.hpDisplay.setText(Math.floor(t.hp));
                if (t.hp <= 0) {
                    t.hpDisplay.setText('DESTROYED');
                    alert('КОНЕЦ ИГРЫ! ПОБЕДА ' + (u.side === 'blue' ? 'СИНИХ' : 'КРАСНЫХ'));
                    db.ref('clash').remove(); // Рестарт базы
                    location.reload();
                }
            }
        });
    }
</script>
</body>
</html>
