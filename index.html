<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BuBattle Royale</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a252f; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow: hidden; touch-action: none; }
        #game { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, onChildChanged, onValue, set, onDisconnect, remove, update as dbUpdate, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCYzLoNr3aS71H4qWAnm5dgUYzhyrSum20",
          authDomain: "clashbattle-5e0b1.firebaseapp.com",
          databaseURL: "https://clashbattle-5e0b1-default-rtdb.firebaseio.com",
          projectId: "clashbattle-5e0b1",
          storageBucket: "clashbattle-5e0b1.firebasestorage.app",
          messagingSenderId: "715854969334",
          appId: "1:715854969334:web:69d0bb0075629735b22fd7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const playerId = Math.random().toString(36).substring(7);
        let playerRole = null, isHost = false; 

        const gamePath = "match_v101_emotes";
        const unitsRef = ref(db, `${gamePath}/units`);
        const eventsRef = ref(db, `${gamePath}/events`);
        const towersRef = ref(db, `${gamePath}/towers`); 

        let elixir = 5, elixirText, selectedCardObj = null, isGameOver = false;
        let unitsMap = {}, towerGroup, projectiles, hpBarsGroup, roleText;
        let timerText, phaseText, lastLogic = 0;
        let gameState = { phase: '1x', startTime: 0, isOvertime: false, tiebreakerStarted: false, overtimeDecided: false };

        window.allCardsData = [
            {id:'knight', c:3, color:0x3498db}, {id:'giant', c:5, color:0xe67e22},
            {id:'archers', c:3, color:0xe84393}, {id:'fireball', c:4, color:0xe74c3c},
            {id:'goblins', c:2, color:0x1abc9c}, {id:'minipekka', c:4, color:0x34495e}, 
            {id:'log', c:2, color:0xd35400}, {id:'cannon', c:3, color:0x7f8c8d},
            {id:'arrows', c:3, color:0x5d4037}, {id:'minions', c:3, color:0x2980b9},
            {id:'skeletons', c:1, color:0xffffff}, {id:'prince', c:5, color:0x8e44ad} 
        ];
        window.userDeck = ['knight', 'giant', 'archers', 'fireball', 'minipekka', 'log', 'skeletons', 'prince'];
                const MenuScene = {
            key: 'MenuScene',
            create: function() {
                this.add.rectangle(200, 400, 400, 800, 0x1a252f);
                
                let battleTab = this.add.container(0, 0);
                let deckTab = this.add.container(0, 0).setVisible(false);

                // --- ВКЛАДКА БОЯ ---
                battleTab.add(this.add.text(200, 100, 'BUBABATTLE ROYALE', { 
                    fontSize: '32px', fill: '#f1c40f', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 
                }).setOrigin(0.5));

                let btnBattle = this.add.rectangle(200, 400, 280, 120, 0xe74c3c).setInteractive();
                btnBattle.setStrokeStyle(4, 0xffffff);
                let txtBattle = this.add.text(200, 400, 'В БОЙ', { fontSize: '48px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
                battleTab.add([btnBattle, txtBattle]);

                btnBattle.on('pointerdown', () => {
                    btnBattle.setFillStyle(0xc0392b);
                    txtBattle.setText('ПОИСК...');
                    
                    get(ref(db, `${gamePath}/players`)).then(snapshot => {
                        const players = snapshot.val() || {};
                        if (!players['me']) {
                            playerRole = 'me';
                            isHost = true;
                        } else {
                            playerRole = 'enemy';
                            isHost = false;
                        }
                        set(ref(db, `${gamePath}/players/${playerRole}`), { ready: true, id: playerId });
                        onDisconnect(ref(db, `${gamePath}/players/${playerRole}`)).remove();
                    });

                    onValue(ref(db, `${gamePath}/players`), (snapshot) => {
                        const p = snapshot.val() || {};
                        if (p['me'] && p['enemy']) {
                            if (isHost) {
                                set(ref(db, `${gamePath}/state`), {
                                    startTime: Date.now(),
                                    phase: '1x',
                                    isOvertime: false
                                });
                            }
                            this.scene.start('GameScene');
                        }
                    });
                });

                // --- ВКЛАДКА КОЛОДЫ ---
                let deckTitle = this.add.text(200, 50, 'ВАША КОЛОДА', { fontSize: '24px', fill: '#fff' }).setOrigin(0.5);
                deckTab.add(deckTitle);

                let renderDeck = () => {
                    for(let i = 0; i < 8; i++) {
                        let card = window.allCardsData.find(c => c.id === window.userDeck[i]);
                        let x = 65 + (i % 4) * 90;
                        let y = 180 + Math.floor(i/4) * 110;
                        let cardBg = this.add.rectangle(x, y, 80, 100, card.color).setStrokeStyle(2, 0xffffff);
                        deckTab.add([cardBg, this.add.text(x, y, card.id.toUpperCase() + '\n💧' + card.c, { 
                            fontSize: '12px', fill: '#fff', align: 'center' 
                        }).setOrigin(0.5)]);
                    }
                };
                renderDeck();

                // --- НАВИГАЦИЯ (НИЗ) ---
                this.add.rectangle(200, 750, 400, 100, 0x2c3e50);
                let btnDeckNav = this.add.rectangle(100, 750, 180, 70, 0x34495e).setInteractive();
                let btnBattleNav = this.add.rectangle(300, 750, 180, 70, 0x34495e).setInteractive();
                
                this.add.text(100, 750, '🃏 КОЛОДА', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
                this.add.text(300, 750, '⚔️ БОЙ', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);

                btnDeckNav.on('pointerdown', () => { 
                    deckTab.setVisible(true); battleTab.setVisible(false); 
                    btnDeckNav.setFillStyle(0x3498db); btnBattleNav.setFillStyle(0x34495e);
                });
                btnBattleNav.on('pointerdown', () => { 
                    battleTab.setVisible(true); deckTab.setVisible(false); 
                    btnBattleNav.setFillStyle(0x3498db); btnDeckNav.setFillStyle(0x34495e);
                });
            }
        };
                const GameScene = {
            key: 'GameScene',
            create: function() {
                let self = this;
                elixir = 5; selectedCardObj = null; isGameOver = false; lastLogic = 0;
                unitsMap = {}; towerGroup = this.add.group(); projectiles = this.add.group(); hpBarsGroup = this.add.group();
                
                onValue(ref(db, `${gamePath}/state`), snap => { if(snap.val()) gameState = snap.val(); });

                let shuffledDeck = [...window.userDeck].sort(() => Math.random() - 0.5);
                self.handIds = shuffledDeck.slice(0, 4); self.nextIds = shuffledDeck.slice(4, 8);
                self.uiElements = [];
                
                timerText = this.add.text(200, 25, '3:00', {fontSize:'28px', fill:'#fff', fontStyle:'bold'}).setOrigin(0.5).setDepth(101);
                phaseText = this.add.text(200, 50, '', {fontSize:'14px', fill:'#f1c40f', fontStyle:'bold'}).setOrigin(0.5).setDepth(101);

                setupTowers(self);
                // Отрисовка травы
                for (let y = 0; y < 600; y += 25) {
                    for (let x = 0; x < 400; x += 25) { this.add.rectangle(x+12.5, y+12.5, 25, 25, ((x+y)/25)%2===0 ? 0x638a4d : 0x739a5d); }
                }
                // Река и мосты
                this.add.rectangle(200, 300, 400, 40, 0x3498db).setDepth(1); 
                this.add.rectangle(100, 300, 50, 60, 0x7d6752).setDepth(2); 
                this.add.rectangle(300, 300, 50, 60, 0x7d6752).setDepth(2); 
                
                this.add.rectangle(200, 700, 400, 200, 0x2c3e50).setDepth(100);
                elixirText = this.add.text(140, 620, '💧 5', {fontSize:'28px', fill:'#3498db', fontStyle:'bold'}).setDepth(101);
                
                // ПАНЕЛЬ ЭМОЦИЙ
                let emoteBtn = self.add.circle(30, 450, 20, 0x34495e).setInteractive().setDepth(101);
                self.add.text(30, 450, '💬', {fontSize:'20px'}).setOrigin(0.5).setDepth(102);
                let emotePanel = self.add.container(200, 400).setDepth(150).setVisible(false);
                emotePanel.add(self.add.rectangle(0, 0, 300, 220, 0x000000, 0.9).setStrokeStyle(2, 0xffffff));
                emoteBtn.on('pointerdown', () => emotePanel.setVisible(!emotePanel.visible));
                
                let emotes = ['👍', '😂', '😭', '😠'];
                emotes.forEach((e, i) => {
                    let b = self.add.rectangle(-90 + i*60, -50, 50, 50, 0xffffff, 0.1).setInteractive();
                    b.on('pointerdown', () => { push(eventsRef, {type:'chat', side:playerRole, msg:e}); emotePanel.setVisible(false); });
                    emotePanel.add([b, self.add.text(-90 + i*60, -50, e, {fontSize:'25px'}).setOrigin(0.5)]);
                });
                
                let phrases = ["Удачи!", "Спасибо!", "Ух ты!", "Ой...", "Хорошая игра!", "Пошел ты нахуй пидор блять"];
                phrases.forEach((p, i) => {
                    let px = (i%2===0) ? -70 : 70; let py = 10 + Math.floor(i/2)*35;
                    let b = self.add.rectangle(px, py, 130, 28, 0x34495e).setInteractive();
                    b.on('pointerdown', () => { push(eventsRef, {type:'chat', side:playerRole, msg:p}); emotePanel.setVisible(false); });
                    emotePanel.add([b, self.add.text(px, py, p, {fontSize:'12px', fill:'#fff', fontStyle:'bold'}).setOrigin(0.5)]);
                });

                self.renderHand = () => {
                    self.uiElements.forEach(e => e.destroy()); self.uiElements = [];
                    self.handIds.forEach((id, i) => {
                        let cData = window.allCardsData.find(c => c.id === id);
                        let btn = self.add.rectangle(100+i*90, 720, 80, 100, cData.color).setInteractive().setDepth(101);
                        btn.on('pointerdown', () => { 
                            selectedCardObj = { data: cData, index: i }; 
                            self.uiElements.forEach(e => { if(e.type === 'Rectangle' && e.isButton) e.setStrokeStyle(0); });
                            btn.setStrokeStyle(4, 0xf1c40f); 
                        });
                        btn.isButton = true;
                        self.uiElements.push(btn, self.add.text(100+i*90, 680, cData.id.toUpperCase(), {fontSize:'10px', fill:'#000'}).setOrigin(0.5).setDepth(102));
                        self.uiElements.push(self.add.text(100+i*90, 740, "💧"+cData.c, {fontSize:'14px', fill:'#fff'}).setOrigin(0.5).setDepth(102));
                    });
                };
                self.renderHand();
                                this.input.on('pointerdown', (p) => {
                    if (!selectedCardObj || p.y > 600 || !playerRole || isGameOver) return;
                    let cData = selectedCardObj.data;
                    if (elixir >= cData.c) {
                        elixir -= cData.c;
                        let tx = isHost ? p.x : 400 - p.x;
                        let ty = isHost ? p.y : 600 - p.y;
                        if (cData.id === 'archers') {
                            push(unitsRef, {x:tx-35, y:ty, type:'archer', owner:playerRole, lane:tx-35<200?'left':'right'});
                            push(unitsRef, {x:tx+35, y:ty, type:'archer', owner:playerRole, lane:tx+35<200?'left':'right'});
                        } else {
                            push(unitsRef, {x:tx, y:ty, type:cData.id, owner:playerRole, lane:tx<200?'left':'right'});
                        }
                        self.handIds[selectedCardObj.index] = self.nextIds.shift();
                        self.nextIds.push(cData.id);
                        selectedCardObj = null; self.renderHand();
                    }
                });

                onChildAdded(unitsRef, (s) => handleSpawn(self, s.val(), s.key));
                onChildRemoved(unitsRef, (s) => { if (unitsMap[s.key]) { unitsMap[s.key].destroy(); delete unitsMap[s.key]; } });
                onChildChanged(unitsRef, (s) => {
                    let d = s.val();
                    if (unitsMap[s.key] && !isHost && d.hp !== undefined) {
                        unitsMap[s.key].setData('hp', d.hp);
                        if (d.hp <= 0) { unitsMap[s.key].destroy(); delete unitsMap[s.key]; }
                    }
                });
                
                onChildAdded(eventsRef, (s) => {
                    let ev = s.val();
                    if (ev.type === 'chat') {
                        let isMeChat = ev.side === playerRole;
                        let bubble = self.add.container(isMeChat ? 270 : 130, isMeChat ? 480 : 120).setDepth(200);
                        bubble.add([self.add.rectangle(0, 0, 140, 40, 0xffffff).setStrokeStyle(2, 0x000), 
                                    self.add.text(0, 0, ev.msg, {fontSize: ev.msg.length>2?'12px':'25px', fill:'#000'}).setOrigin(0.5)]);
                        self.time.delayedCall(2500, () => bubble.destroy());
                    } else if (ev.type === 'spell_boom') doSpellBoom(self, ev.x, ev.y, ev.owner, ev.spellId);
                });
            },
            update: function(time) {
                if (isGameOver || !playerRole || !gameState.startTime) return;
                let elapsed = (Date.now() - gameState.startTime) / 1000;
                let remaining = 180 - elapsed, mult = (elapsed > 120) ? 2 : 1;
                if (elapsed > 180) { remaining = 240 - elapsed; mult = 3; phaseText.setText('OVERTIME x3'); }
                let disp = Math.max(0, Math.floor(remaining));
                timerText.setText(Math.floor(disp/60) + ':' + (disp%60<10?'0':'') + disp%60);
                if (elixir < 10) elixir += 0.0035 * mult;
                elixirText.setText('💧 ' + Math.floor(elixir));

                projectiles.children.entries.forEach(p => {
                    let t = p.getData('target'); if (!t || !t.active) { p.destroy(); return; }
                    let ang = Phaser.Math.Angle.Between(p.x, p.y, t.x, t.y);
                    p.x += Math.cos(ang)*10; p.y += Math.sin(ang)*10; p.rotation = ang;
                    if (Phaser.Math.Distance.Between(p.x, p.y, t.x, t.y) < 15) {
                        if (isHost) t.getData('isT') ? updateTowerHP(this, t, p.getData('dmg')) : applyUnitDmg(t, p.getData('dmg'), p.getData('dbKey'));
                        p.destroy();
                    }
                });

                if (time > lastLogic + 100) {
                    lastLogic = time;
                    Object.keys(unitsMap).forEach(id => {
                        let u = unitsMap[id]; if (!u || !u.active) return;
                        let side = u.getData('owner'), range = u.getData('type') === 'archer' ? 140 : 65;
                        let targets = [...towerGroup.children.entries.filter(t => t.getData('side') !== side && t.active)];
                        targets = targets.concat(Object.values(unitsMap).filter(eu => eu.active && eu.getData('owner') !== side));
                        let closest = this.physics.closest(u, targets);
                        if (closest) {
                            let dist = Phaser.Math.Distance.Between(u.x, u.y, closest.x, closest.y);
                            if (dist <= range) {
                                u.body.setVelocity(0);
                                u.rotation = Phaser.Math.Angle.Between(u.x, u.y, closest.x, closest.y) + Math.PI/2;
                                if (time > (u.getData('lastAtk') || 0) + u.getData('atkSpd')) {
                                    u.setData('lastAtk', time);
                                    if (u.getData('type') === 'archer') launchProj(this, u, closest, u.getData('pwr'), 'arrow', closest.getData('dbKey'));
                                    else if (isHost) applyUnitDmg(closest, u.getData('pwr'), closest.getData('dbKey'));
                                }
                            } else {
                                let dx = closest.x, dy = closest.y;
                                if (Math.abs(u.y - 300) > 20 && Math.abs(dy - 300) > 20 && (u.y - 300) * (dy - 300) < 0) {
                                    dx = u.getData('lane') === 'left' ? 100 : 300;
                                    dy = u.y < 300 ? 340 : 260;
                                }
                                this.physics.moveTo(u, dx, dy, u.getData('spd'));
                                u.rotation = Phaser.Math.Angle.Between(u.x, u.y, dx, dy) + Math.PI/2;
                            }
                        }
                    });
                }
            }
        };
        function handleSpawn(scene, d, k) {
    let tx = isHost ? d.x : 400 - d.x, ty = isHost ? d.y : 600 - d.y;
    if (d.type === 'fireball') {
        let s = scene.add.circle(tx, d.owner === playerRole ? 850 : -50, 15, 0xe67e22).setDepth(60);
        scene.tweens.add({ targets: s, x: tx, y: ty, duration: 1200, onUpdate: () => {
            let p = scene.add.rectangle(s.x + (Math.random()-0.5)*20, s.y + (Math.random()-0.5)*20, 6, 6, 0xf1c40f);
            scene.tweens.add({targets: p, alpha: 0, scale: 0.1, duration: 400, onComplete: () => p.destroy()});
        }, onComplete: () => { s.destroy(); if(isHost){ push(eventsRef, {type:'spell_boom', x:d.x, y:d.y, owner:d.owner, spellId:'fireball'}); remove(ref(db, `${gamePath}/units/${k}`)); }}});
        return;
    }
    let cfgs = {
        knight:{s:20, p:40, h:450, sz:22, a:1200}, giant:{s:13, p:100, h:860, sz:30, a:2000},
        archer:{s:17, p:30, h:160, sz:16, a:1200}, goblin:{s:30, p:20, h:90, sz:14, a:1000},
        minipekka:{s:35, p:260, h:380, sz:20, a:2000}, cannon:{s:0, p:38, h:400, sz:30, isB:true, a:3000},
        minion:{s:25, p:40, h:90, sz:14, a:1000}, skeleton:{s:25, p:10, h:1, sz:10, a:1000}, prince:{s:22, p:230, h:450, sz:22, a:2000}
    };
    let c = cfgs[d.type] || cfgs.knight;
    if (isHost && d.hp === undefined) dbUpdate(ref(db, `${gamePath}/units/${k}`), { hp: c.h });
    createU(scene, tx, ty, d.owner, c, d.type, k, d.lane);
}

function createU(scene, x, y, owner, c, type, key, lane) {
    let isMe = owner === playerRole, u = scene.add.container(x, y);
    scene.physics.add.existing(u); u.body.setSize(c.sz, c.sz).setOffset(-c.sz/2, -c.sz/2);
    let col = isMe ? 0x3498db : 0xe74c3c;
    if (type === 'minipekka') {
        u.add([scene.add.rectangle(0, 0, 20, 20, 0x2c3e50), scene.add.rectangle(0, -6, 12, 4, 0x00ffff), scene.add.rectangle(12, -4, 4, 18, 0x7f8c8d)]);
    } else if (type === 'prince') {
        u.add([scene.add.rectangle(0, 0, 22, 22, col), scene.add.rectangle(12, -10, 4, 35, 0xf1c40f), scene.add.rectangle(0, -12, 16, 6, 0x000)]);
    } else if (type === 'giant') {
        u.add([scene.add.rectangle(0, 0, 30, 35, 0xe67e22), scene.add.rectangle(0, -10, 20, 20, 0xffcc99)]);
    } else if (type === 'cannon') {
        u.add(scene.add.rectangle(0, 0, 30, 30, 0x7f8c8d));
        let g = scene.add.container(0, 0); g.add(scene.add.rectangle(0, -12, 8, 20, 0x000)); u.add(g); u.setData('weapon', g);
    } else {
        u.add(scene.add.rectangle(0, 0, c.sz, c.sz, col));
        if(type === 'archer') u.add(scene.add.circle(0, 0, 6, 0xe84393));
    }
    u.rotation = isMe ? 0 : Math.PI;
    u.setData({spd:c.s, pwr:c.p, type:type, owner:owner, lane:lane, hp:c.h, maxHp:c.h, dbKey:key, atkSpd:c.a});
    hpBarsGroup.add(scene.add.rectangle(x, y-22, 25, 4, isMe?0x2ecc71:0xe74c3c).setDepth(21).setData('owner', u));
    unitsMap[key] = u;
}

function setupTowers(scene) {
    towerGroup.clear(true, true);
    const ts = [
        {id:'eL', x:100, y:100, s:'enemy', m:false}, {id:'eR', x:300, y:100, s:'enemy', m:false}, {id:'eM', x:200, y:50, s:'enemy', m:true},
        {id:'mL', x:100, y:500, s:'me', m:false}, {id:'mR', x:300, y:500, s:'me', m:false}, {id:'mM', x:200, y:550, s:'me', m:true}
    ];
    ts.forEach(d => {
        let tx = isHost ? d.x : 400 - d.x, ty = isHost ? d.y : 600 - d.y, isMe = d.s === playerRole, w = d.m ? 50 : 40;
        let t = scene.add.container(tx, ty); scene.physics.add.existing(t, true);
        t.add([scene.add.rectangle(0, 0, w, w, 0x7f8c8d), scene.add.rectangle(0, 0, w-10, w-10, isMe?0x2980b9:0xc0392b)]);
        let dirY = isMe ? -1 : 1;
        if (d.m) {
            t.add(scene.add.circle(0, dirY*2, 8, 0xffcc99));
            let g = scene.add.rectangle(0, dirY*15, 10, 18, 0x000).setVisible(false); t.add(g); t.setData('weapon', g);
        } else {
            t.add(scene.add.circle(0, 0, 8, 0xe84393));
            let b = scene.add.rectangle(0, dirY*12, 18, 4, 0x000); t.add(b); t.setData('weapon', b);
        }
        towerGroup.add(t); t.setData({id:d.id, hp:d.m?2500:1300, maxHp:d.m?2500:1300, side:d.s, isM:d.m, isA:!d.m, isT:true, bar:scene.add.rectangle(tx, ty-35, w, 6, isMe?0x2ecc71:0xe74c3c).setDepth(11)});
    });
    if(isHost) ts.forEach(d => dbUpdate(ref(db, `${gamePath}/towers/${d.id}`), { hp: d.m?2500:1300 }));
}

function launchProj(scene, s, t, dmg, type, key) {
    let p = type === 'arrow' ? scene.add.rectangle(s.x, s.y, 12, 3, 0x000) : scene.add.circle(s.x, s.y, 8, 0x2c3e50);
    projectiles.add(p.setDepth(40).setData({target:t, dmg:dmg, dbKey:key}));
}

function applyUnitDmg(u, d, k) {
    if (!isHost || !u || !u.active) return;
    let hp = Math.max(0, u.getData('hp') - d); u.setData('hp', hp);
    if (hp <= 0) { remove(ref(db, `${gamePath}/units/${k}`)); u.destroy(); delete unitsMap[k]; }
    else dbUpdate(ref(db, `${gamePath}/units/${k}`), { hp: hp });
}

function updateTowerHP(scene, t, d) {
    if (!isHost || !t || !t.active) return;
    let hp = Math.max(0, t.getData('hp') - d); t.setData('hp', hp);
    if (hp <= 0) { remove(ref(db, `${gamePath}/towers/${t.getData('id')}`)); destroyTower(scene, t); }
    else {
        dbUpdate(ref(db, `${gamePath}/towers/${t.getData('id')}`), { hp: hp });
        t.getData('bar').width = (hp/t.getData('maxHp')) * (t.getData('isM')?50:40);
    }
}

function destroyTower(scene, t) {
    if (!t.active) return;
    if (t.getData('isM')) { isGameOver = true; scene.add.text(60, 300, t.getData('side') === playerRole ? 'ПОРАЖЕНИЕ' : 'ПОБЕДА!', {fontSize:'45px', fill:'#f1c40f'}).setDepth(200); }
    t.destroy();
}

function doSpellBoom(scene, x, y, owner, id) {
    let tx = isHost ? x : 400 - x, ty = isHost ? y : 600 - y;
    let f = scene.add.circle(tx, ty, 60, 0xe67e22, 0.6); scene.time.delayedCall(300, () => f.destroy());
    if (isHost) {
        towerGroup.children.entries.forEach(t => { if(t.active && Phaser.Math.Distance.Between(tx, ty, t.x, t.y) < 80 && t.getData('side') !== owner) updateTowerHP(scene, t, 200); });
        Object.values(unitsMap).forEach(u => { if(u.active && Phaser.Math.Distance.Between(tx, ty, u.x, u.y) < 60 && u.getData('owner') !== owner) applyUnitDmg(u, 150, u.getData('dbKey')); });
    }
}

new Phaser.Game({type:Phaser.AUTO, width:400, height:800, parent:'game', physics:{default:'arcade'}, scene:[MenuScene, GameScene]});
</script>
